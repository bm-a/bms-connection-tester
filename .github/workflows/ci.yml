name: ci
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio
      - run: pio test -e native
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio
      - run: pio run -e esp32-s3-devkitc-1 -e s3-n16r8
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -O2 -std=c++17 -I src src/bms_protocol.cpp src/relay_ctrl.cpp tools/soak_sim.cpp -o soak && ./soak
  emu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: g++ -O2 -std=c++17 -DARDUINO -I tools/fw_emu -I src src/bms_protocol.cpp src/relay_ctrl.cpp src/web_ui.cpp tools/fw_emu/emu_main.cpp -o fw_emu
      - run: FW_EMU_PORT=18080 FW_EMU_CTL=18081 ./fw_emu > emu.log 2>&1 & sleep 2
      - run: python3 tools/fw_emu/drive_emu.py 18080 18081
      - run: python3 tools/fw_emu/drive_soak.py 18080 18081
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_web_contract.py
      - run: mkdir -p .unity && for f in unity.h unity.c unity_internals.h; do curl -sL --max-time 60 "https://raw.githubusercontent.com/ThrowTheSwitch/Unity/master/src/$f" -o ".unity/$f"; done
      - run: g++ -std=c++17 -DARDUINO -I test/test_web -I src -I .unity src/bms_protocol.cpp src/relay_ctrl.cpp src/web_ui.cpp test/test_web/test_web.cpp .unity/unity.c -o test_web
      - run: ./test_web
  wokwi-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          if [ -z "$WOKWI_CLI_TOKEN" ]; then
            echo "WOKWI_CLI_TOKEN not set - skipping headless sim (see wiki/Emulators.md)"
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: { python-version: "3.12" }
      - run: pip install platformio
        if: steps.gate.outputs.run == 'true'
      - run: pio run -e esp32-s3-devkitc-1
        if: steps.gate.outputs.run == 'true'
      - run: curl -L https://wokwi.com/ci/install.sh | sh
        if: steps.gate.outputs.run == 'true'
      - run: wokwi-cli wokwi --timeout 90000 --scenario wokwi/sim.yaml
        if: steps.gate.outputs.run == 'true'
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
