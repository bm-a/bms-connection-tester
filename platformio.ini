[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_cache_dir = .pio/cache
# No variant flag: plain env defaults to FW_VARIANT "8mb" (see ota.h) and
# WEB_UI_VARIANT 1 = FULL dashboard (see web_ui.cpp). OTA assets stay FULL.

# ESP32-S3 N16R8 (16 MB flash + 8 MB octal PSRAM, onboard WS2812 on GPIO48).
# Same firmware + pins as above, just the correct flash/PSRAM map for boards
# like the ESP32-S3-DevKit N16R8. Wokwi still uses esp32-s3-devkitc-1 (8 MB).
[env:s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_cache_dir = .pio/cache
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DRGB_BUILTIN=48
  -DFW_IS_N16R8=1

# On-target unit tests (needs a board plugged in for upload/run;
# --without-uploading compiles them only). Extends the firmware env
# but links only the hardware-independent protocol file.
[env:s3_tests]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
test_build_src = yes
build_src_filter = +<bms_protocol.cpp> +<relay_ctrl.cpp> +<ota.cpp>

# v2.7 dashboard variants (8 MB board; WEB_UI_VARIANT selects the PAGE_DASH
# compiled in — only one variant per binary, no flash bloat):
# s3-classic = v2.6 page verbatim (0), s3-lite = relays+names+link only (2).
# Default envs above = FULL (1). n16r8 classic/lite: copy the flag onto s3-n16r8.

# Waveshare ESP32-S3-ETH-8DI-8RO (ESP32-S3-WROOM-1-N16R8: 16 MB flash + 8 MB
# OPI PSRAM). Board variant, NOT just a flash map:
#  - relays R1-R8 via TCA9554PWR @ I2C 0x20 (SDA42/SCL41, EXIO1-8 = bits 0-7,
#    HIGH bit = ON; web "active-low" toggle is a no-op on this board)
#  - RS485 TX17/RX18, hardware auto direction (no DE pin)
#  - BOOT button (GPIO0) = START/STOP; DI1 (GPIO4) = spoof trigger default;
#    DI2 (GPIO5) = WiFi kill default; RGB status on GPIO38
#  - W5500 Ethernet (GPIO12-16) reserved; Ethernet NOT integrated (Wi-Fi kept)
#  - own OTA line: FW_VERSION 2.7-wsN, asset waveshare-firmware.bin,
#    prerelease tags v2.7-wsN (never /releases/latest — generic boards safe)
[env:s3-waveshare]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_cache_dir = .pio/cache
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DBOARD_WAVESHARE_8DI8RO=1
[env:s3-classic]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_cache_dir = .pio/cache
build_flags =
  -DWEB_UI_VARIANT=0

[env:s3-lite]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_cache_dir = .pio/cache
build_flags =
  -DWEB_UI_VARIANT=2

[env:native]
platform = native
test_framework = unity
test_filter = test_checksum, test_logic, test_parser, test_stress, test_relay, test_spoof, test_system, test_ota, test_upload, test_meter
test_build_src = yes
build_src_filter = +<bms_protocol.cpp> +<relay_ctrl.cpp> +<ota.cpp>
