[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_cache_dir = .pio/cache

# On-target unit tests (needs a board plugged in for upload/run;
# --without-uploading compiles them only). Extends the firmware env
# but links only the hardware-independent protocol file.
[env:s3_tests]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
test_build_src = yes
build_src_filter = +<bms_protocol.cpp>

[env:native]
platform = native
test_framework = unity
test_filter = test_checksum, test_logic, test_parser, test_stress
test_build_src = yes
build_src_filter = +<bms_protocol.cpp>
