[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_cache_dir = .pio/cache
# No variant flag: plain env defaults to FW_VARIANT "8mb" (see ota.h).

# ESP32-S3 N16R8 (16 MB flash + 8 MB octal PSRAM, onboard WS2812 on GPIO48).
# Same firmware + pins as above, just the correct flash/PSRAM map for boards
# like the ESP32-S3-DevKit N16R8. Wokwi still uses esp32-s3-devkitc-1 (8 MB).
[env:s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_cache_dir = .pio/cache
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DRGB_BUILTIN=48
  -DFW_IS_N16R8=1

# On-target unit tests (needs a board plugged in for upload/run;
# --without-uploading compiles them only). Extends the firmware env
# but links only the hardware-independent protocol file.
[env:s3_tests]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
test_build_src = yes
build_src_filter = +<bms_protocol.cpp> +<relay_ctrl.cpp> +<ota.cpp>

[env:native]
platform = native
test_framework = unity
test_filter = test_checksum, test_logic, test_parser, test_stress, test_relay, test_spoof, test_system, test_ota, test_upload, test_meter
test_build_src = yes
build_src_filter = +<bms_protocol.cpp> +<relay_ctrl.cpp> +<ota.cpp>
